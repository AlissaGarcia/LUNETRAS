# LUNETRAS Application Configuration

# Application
spring.application.name=lunetras

# Server Configuration
server.port=8080
# Fix for GitHub Codespaces - handle forwarded headers properly
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lunetras
spring.datasource.username=lunetras
spring.datasource.password=lunetras
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Profiles
spring.profiles.active=docker

# CORS Configuration (for development)
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,https://*.github.dev