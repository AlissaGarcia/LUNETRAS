server {
    listen 80;
    server_name _;

    # Raiz do aplicativo frontend
    root /usr/share/nginx/html;
    index index.html;

    # Proxy para requisições de API - intercepta TODOS os endpoints que não existem no frontend
    location ~ ^/(auth|turmas|alunos|avaliacoes|relatorios|usuarios|api)/ {
        proxy_pass http://lunetras-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # SPA: redirecionar todas as outras rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
